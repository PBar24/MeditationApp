<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Flow - Precision Tracking</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0d0f12 0%, #1a1d21 100%);
            --card-bg: rgba(22, 25, 29, 0.98);
            --text-primary: #ffffff;
            --accent: #4cc9f0;
            --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #ff7675;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(60px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 2.5rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 12px 8px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
            transition: 0.3s;
        }

        .stat-card:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: var(--accent);
        }

        .stat-value { 
            display: block; 
            font-size: 1.2rem; 
            font-weight: 700; 
            color: var(--accent); 
        }
        
        .stat-label { 
            font-size: 0.6rem; 
            text-transform: uppercase; 
            color: #888; 
            letter-spacing: 1px; 
            margin-top: 4px;
        }

        .circle-container {
            position: relative;
            height: 160px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 20px 0;
        }

        .breathing-circle {
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, var(--accent) 0%, rgba(76, 201, 240, 0) 70%);
            opacity: 0.6;
            border-radius: 50%;
            filter: blur(6px);
            transition: transform 4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 0 30px rgba(76, 201, 240, 0.3);
        }

        .breathing-circle.expand { 
            transform: scale(1.8); 
            opacity: 0.8;
        }

        .breathing-text { 
            position: absolute; 
            font-size: 1rem; 
            font-weight: 600; 
            letter-spacing: 2px; 
            text-transform: uppercase;
            color: var(--accent);
        }

        .timer-display { 
            font-size: 5rem; 
            font-weight: 700; 
            margin: 10px 0; 
            font-variant-numeric: tabular-nums; 
            color: var(--accent);
        }

        .controls { 
            display: flex; 
            flex-direction: column; 
            gap: 15px; 
            margin-bottom: 20px; 
        }
        
        .input-row { 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            gap: 12px; 
            font-size: 0.9rem; 
            color: #999;
        }
        
        input {
            width: 70px;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            text-align: center;
            font-size: 1.1rem;
            font-weight: 600;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(76, 201, 240, 0.1);
            box-shadow: 0 0 15px rgba(76, 201, 240, 0.2);
        }
        
        .btn-group { 
            display: flex; 
            gap: 12px; 
        }

        button {
            flex: 1;
            background: var(--accent);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.95rem;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(76, 201, 240, 0.3);
        }

        button:active {
            transform: translateY(0);
        }
        
        #resetBtn { 
            background: transparent; 
            border: 1.5px solid rgba(255, 118, 117, 0.6); 
            color: var(--danger);
        }

        #resetBtn:hover {
            background: rgba(255, 118, 117, 0.1);
            border-color: var(--danger);
            box-shadow: 0 8px 25px rgba(255, 118, 117, 0.2);
        }

        .history-section {
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            padding: 18px;
            text-align: left;
            font-size: 0.85rem;
            border: 1px solid var(--glass-border);
            max-height: 200px;
            overflow-y: auto;
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 8px;
        }

        .history-header span {
            font-size: 0.75rem;
            color: #666;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .clear-btn {
            font-size: 0.7rem;
            color: var(--danger);
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            background: none;
            border: 1px solid rgba(255, 118, 117, 0.4);
            padding: 6px 12px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .clear-btn:hover {
            background: rgba(255, 118, 117, 0.1);
            border-color: var(--danger);
        }
        
        #historyList { 
            list-style: none;
            padding: 0;
            margin: 0;
            max-height: 150px;
            overflow-y: auto;
        }

        li { 
            display: flex; 
            justify-content: space-between; 
            padding: 8px 0; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.05); 
            color: #ffffff;
        }

        li:last-child {
            border-bottom: none;
        }

        li span:last-child {
            color: var(--accent);
            font-weight: 600;
        }

        @media (max-width: 480px) {
            .container {
                padding: 1.8rem;
                border-radius: 30px;
            }

            .timer-display {
                font-size: 4rem;
            }

            .stat-value {
                font-size: 1rem;
            }

            input {
                width: 60px;
                font-size: 1rem;
                padding: 10px;
            }

            button {
                padding: 12px;
                font-size: 0.85rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-value" id="streakVal">0</span>
                <span class="stat-label">Streak</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="totalSessVal">0</span>
                <span class="stat-label">Sessions</span>
            </div>
            <div class="stat-card">
                <span class="stat-value" id="totalTimeVal">00:00</span>
                <span class="stat-label">Total Time</span>
            </div>
        </div>

        <div class="circle-container">
            <div class="breathing-circle" id="circle"></div>
            <div class="breathing-text" id="breathingText">Ready</div>
        </div>

        <div class="timer-display" id="display">05:00</div>
        
        <div class="controls">
            <div class="input-row">
                <input type="number" id="minutes" value="5" min="0"> 
                <span>min</span>
                <input type="number" id="secondsInput" value="0" min="0"> 
                <span>sec</span>
            </div>
            
            <div class="btn-group">
                <button id="startBtn">Begin</button>
                <button id="resetBtn">Reset</button>
            </div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <span>Logs (M:S)</span>
                <button class="clear-btn" id="clearHistoryBtn">Clear</button>
            </div>
            <ul id="historyList"></ul>
        </div>
    </div>

    <audio id="gong" preload="auto">
        <source src="gong.mp3" type="audio/mpeg">
    </audio>

    <script>
        let countdown;
        let breathingInterval;
        let isMeditating = false;

        const display = document.getElementById('display');
        const minInput = document.getElementById('minutes');
        const secInput = document.getElementById('secondsInput');
        const circle = document.getElementById('circle');
        const breathingText = document.getElementById('breathingText');
        const gong = document.getElementById('gong');

        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60);
            const s = Math.floor(totalSeconds % 60);
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function updateDisplay() {
            if (isMeditating) return;
            const totalSeconds = (parseInt(minInput.value) || 0) * 60 + (parseInt(secInput.value) || 0);
            display.textContent = formatTime(totalSeconds);
        }

        [minInput, secInput].forEach(i => i.addEventListener('input', updateDisplay));

        function calculateStreak() {
            const history = JSON.parse(localStorage.getItem('medHistory')) || [];
            if (history.length === 0) return 0;

            let streak = 0;
            const today = new Date();
            
            for (let i = history.length - 1; i >= 0; i--) {
                const sessionDate = new Date(history[i].date);
                const expectedDate = new Date(today);
                expectedDate.setDate(expectedDate.getDate() - streak);
                
                if (sessionDate.toLocaleDateString() === expectedDate.toLocaleDateString()) {
                    streak++;
                } else {
                    break;
                }
            }
            
            return streak;
        }

        function startMeditation(total) {
            isMeditating = true;
            gong.currentTime = 0;
            gong.play().catch(e => console.log("Gong play failed:", e));

            let inhale = true;
            breathingText.textContent = "Inhale";
            circle.classList.add('expand');
            breathingInterval = setInterval(() => {
                inhale = !inhale;
                breathingText.textContent = inhale ? "Inhale" : "Exhale";
                inhale ? circle.classList.add('expand') : circle.classList.remove('expand');
            }, 4000);

            const then = Date.now() + total * 1000;
            countdown = setInterval(() => {
                const left = Math.round((then - Date.now()) / 1000);
                if (left < 0) { stopMeditation(true, total); return; }
                display.textContent = formatTime(left);
            }, 1000);
        }

        function stopMeditation(completed, total) {
            clearInterval(countdown);
            clearInterval(breathingInterval);
            isMeditating = false;
            circle.classList.remove('expand');
            breathingText.textContent = completed ? "✨ Peace" : "Ready";
            updateDisplay();

            if (completed) {
                gong.currentTime = 0;
                gong.play().catch(e => console.log("Gong play failed:", e));
                saveToHistory(total);
            }
        }

        function saveToHistory(totalSecs) {
            const history = JSON.parse(localStorage.getItem('medHistory')) || [];
            history.push({ 
                date: new Date().toLocaleDateString(), 
                duration: totalSecs
            });
            localStorage.setItem('medHistory', JSON.stringify(history));
            updateStats();
        }

        function updateStats() {
            const history = JSON.parse(localStorage.getItem('medHistory')) || [];
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            let totalSecondsAccumulated = 0;
            
            history.slice().reverse().forEach(entry => {
                totalSecondsAccumulated += entry.duration;
                const li = document.createElement('li');
                li.innerHTML = `<span>${entry.date}</span> <span>${formatTime(entry.duration)}</span>`;
                list.appendChild(li);
            });

            const streak = calculateStreak();
            document.getElementById('streakVal').textContent = streak;
            document.getElementById('totalSessVal').textContent = history.length;
            document.getElementById('totalTimeVal').textContent = formatTime(totalSecondsAccumulated);
        }

        document.getElementById('clearHistoryBtn').addEventListener('click', () => {
            if(confirm("Clear history?")) { 
                localStorage.removeItem('medHistory'); 
                updateStats(); 
            }
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            if (isMeditating) return;
            
            // Prime audio
            gong.play().then(() => {
                gong.pause();
                gong.currentTime = 0;
            }).catch(e => console.log("Audio unlock failed:", e));

            const total = (parseInt(minInput.value)||0)*60 + (parseInt(secInput.value)||0);
            if (total > 0) startMeditation(total);
        });

        document.getElementById('resetBtn').addEventListener('click', () => stopMeditation(false));
        updateStats();
    </script>
</body>
</html>
