<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Flow Meditation</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-primary: #2c3e50;
            --accent: #5e72e4;
            --glass-border: rgba(255, 255, 255, 0.4);
            --circle-bg: radial-gradient(circle, #5e72e4 0%, rgba(255,255,255,0) 70%);
        }

        [data-theme="dark"] {
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --card-bg: rgba(30, 30, 35, 0.85);
            --text-primary: #ecf0f1;
            --accent: #4facfe;
            --glass-border: rgba(255, 255, 255, 0.1);
            --circle-bg: radial-gradient(circle, #4facfe 0%, rgba(255,255,255,0) 70%);
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
            transition: all 0.5s ease;
        }

        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            background: var(--card-bg);
            padding: 10px 15px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            font-size: 0.8rem;
            cursor: pointer;
            z-index: 100;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 2.5rem;
            width: 380px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            text-align: center;
        }

        h1 { font-weight: 300; letter-spacing: 2px; text-transform: uppercase; margin-top: 0; margin-bottom: 2rem; }

        .circle-container {
            position: relative; height: 160px; display: flex;
            justify-content: center; align-items: center; margin: 20px 0;
        }
        .breathing-circle {
            width: 80px; height: 80px; background: var(--circle-bg);
            opacity: 0.6; border-radius: 50%; filter: blur(4px);
            transition: transform 4s cubic-bezier(0.45, 0.05, 0.55, 0.95);
        }
        .breathing-circle.expand { transform: scale(1.8); }
        .breathing-text { position: absolute; font-size: 0.9rem; font-weight: 600; }

        .timer-display { font-size: 4rem; font-weight: 600; margin: 10px 0; }

        .controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; }
        input {
            width: 60px; padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.2); color: var(--text-primary); text-align: center;
        }
        button {
            background: var(--accent); color: white; border: none; padding: 12px 20px;
            border-radius: 12px; font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        button:hover { opacity: 0.9; transform: translateY(-1px); }

        .history-section {
            background: rgba(0,0,0,0.05); border-radius: 20px; padding: 15px;
            text-align: left; font-size: 0.85rem; max-height: 180px; overflow-y: auto;
        }
        ul { list-style: none; padding: 0; margin: 10px 0; }
        li { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        
        .secondary-btn { background: #95a5a6; margin-top: 10px; width: 100%; font-size: 0.7rem; }

        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--accent); }
        input:checked + .slider:before { transform: translateX(14px); }
    </style>
</head>
<body>

    <div class="theme-toggle">
        <label class="switch">
            <input type="checkbox" id="darkModeToggle">
            <span class="slider"></span>
        </label>
        <span>Dark Mode</span>
    </div>

    <div class="container">
        <h1>Zen Flow</h1>

        <div class="circle-container">
            <div class="breathing-circle" id="circle"></div>
            <div class="breathing-text" id="breathingText">Ready</div>
        </div>

        <div class="timer-display" id="display">05:00</div>
        
        <div class="controls">
            <input type="number" id="minutes" value="5" min="1">
            <button id="startBtn">Start Session</button>
            <button id="resetBtn" style="background:#e74c3c">Reset</button>
        </div>

        <div class="history-section">
            <strong>Session History</strong>
            <p>Total Meditation: <span id="totalTime">0</span>m</p>
            <ul id="historyList"></ul>
            <button id="clearHistory" class="secondary-btn">Clear History</button>
        </div>
    </div>

    <audio id="gong" preload="auto">
        <source src="gong.mp3" type="audio/mpeg">
    </audio>

    <script>
        let countdown;
        let breathingInterval;
        let isMeditating = false;

        const display = document.getElementById('display');
        const minutesInput = document.getElementById('minutes');
        const startBtn = document.getElementById('startBtn');
        const resetBtn = document.getElementById('resetBtn');
        const circle = document.getElementById('circle');
        const breathingText = document.getElementById('breathingText');
        const historyList = document.getElementById('historyList');
        const totalTimeDisplay = document.getElementById('totalTime');
        const gong = document.getElementById('gong');
        const themeToggle = document.getElementById('darkModeToggle');

        themeToggle.addEventListener('change', () => {
            document.body.setAttribute('data-theme', themeToggle.checked ? 'dark' : 'light');
        });

        function timer(seconds) {
            clearInterval(countdown);
            const now = Date.now();
            const then = now + seconds * 1000;
            const originalMinutes = minutesInput.value;

            isMeditating = true;
            startBreathing();
            
            countdown = setInterval(() => {
                const secondsLeft = Math.round((then - Date.now()) / 1000);

                if (secondsLeft < 0) {
                    clearInterval(countdown);
                    stopBreathing();
                    
                    gong.currentTime = 0;
                    gong.play().catch(e => console.log("Audio play failed. Check gong.mp3.", e));
                    
                    saveSession(originalMinutes);
                    return;
                }
                displayTime(secondsLeft);
            }, 1000);
        }

        function startBreathing() {
            let inhale = true;
            breathingText.textContent = "Inhale";
            circle.classList.add('expand');
            breathingInterval = setInterval(() => {
                inhale = !inhale;
                breathingText.textContent = inhale ? "Inhale" : "Exhale";
                inhale ? circle.classList.add('expand') : circle.classList.remove('expand');
            }, 4000);
        }

        function stopBreathing() {
            clearInterval(breathingInterval);
            circle.classList.remove('expand');
            breathingText.textContent = "Done";
        }

        function displayTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            display.textContent = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function saveSession(mins) {
            const history = JSON.parse(localStorage.getItem('medHistory')) || [];
            history.push({
                date: new Date().toLocaleDateString(),
                duration: mins
            });
            localStorage.setItem('medHistory', JSON.stringify(history));
            loadHistory();
            isMeditating = false;
        }

        function loadHistory() {
            const history = JSON.parse(localStorage.getItem('medHistory')) || [];
            historyList.innerHTML = '';
            let total = 0;
            history.slice().reverse().forEach(entry => {
                const li = document.createElement('li');
                li.innerHTML = `<span>${entry.date}</span> <span>${entry.duration} min</span>`;
                historyList.appendChild(li);
                total += parseInt(entry.duration);
            });
            totalTimeDisplay.textContent = total;
        }

        startBtn.addEventListener('click', () => {
            // Prime audio
            gong.play().then(() => {
                gong.pause();
                gong.currentTime = 0;
            }).catch(e => console.log("Audio unlock failed:", e));

            const mins = minutesInput.value;
            if (mins > 0) timer(mins * 60);
        });

        resetBtn.addEventListener('click', () => {
            clearInterval(countdown);
            clearInterval(breathingInterval);
            isMeditating = false;
            display.textContent = `${minutesInput.value.padStart(2, '0')}:00`;
            circle.classList.remove('expand');
            breathingText.textContent = "Ready";
            gong.pause();
        });

        document.getElementById('clearHistory').addEventListener('click', () => {
            if(confirm("Delete all session history?")) {
                localStorage.removeItem('medHistory');
                loadHistory();
            }
        });

        loadHistory();
    </script>
</body>
</html>
