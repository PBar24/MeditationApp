<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zen Flow - Always Awake</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0d0f12 0%, #1a1d21 100%);
            --card-bg: rgba(22, 25, 29, 0.98);
            --text-primary: #ffffff;
            --accent: #4cc9f0;
            --glass-border: rgba(255, 255, 255, 0.1);
            --danger: #ff7675;
        }

        body {
            background: var(--bg-gradient);
            min-height: 100vh;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Inter', sans-serif;
            color: var(--text-primary);
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(60px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 2.5rem;
            width: 350px;
            box-shadow: 0 40px 100px rgba(0,0,0,0.9);
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px 5px;
            border-radius: 18px;
            border: 1px solid var(--glass-border);
        }

        .stat-value { display: block; font-size: 0.95rem; font-weight: 600; color: #fff; }
        .stat-label { font-size: 0.5rem; text-transform: uppercase; color: var(--accent); letter-spacing: 1px; }

        .circle-container {
            position: relative; height: 160px; display: flex;
            justify-content: center; align-items: center;
        }

        .breathing-circle {
            width: 80px; height: 80px; 
            background: radial-gradient(circle, var(--accent) 0%, rgba(76, 201, 240, 0) 70%);
            opacity: 0.5; border-radius: 50%; filter: blur(4px);
            transition: transform 4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .breathing-circle.expand { transform: scale(2.2); opacity: 0.7; }
        .breathing-text { position: absolute; font-size: 0.9rem; font-weight: 300; letter-spacing: 2px; text-transform: uppercase; }

        .timer-display { font-size: 4.5rem; font-weight: 600; margin: 5px 0; font-variant-numeric: tabular-nums; color: #fff; }

        .controls { display: flex; flex-direction: column; gap: 15px; margin-bottom: 20px; }
        
        .input-row { display: flex; justify-content: center; align-items: center; gap: 8px; font-size: 0.85rem; color: #aaa; }
        
        input {
            width: 60px; padding: 10px; border-radius: 12px; border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.1); color: #fff; text-align: center; font-size: 1rem;
        }
        
        .btn-group { display: flex; gap: 12px; }

        button {
            flex: 1; background: var(--accent); color: #000; border: none; padding: 16px;
            border-radius: 15px; font-weight: 600; cursor: pointer; transition: 0.3s;
        }
        
        #resetBtn { background: transparent; border: 1px solid rgba(255, 118, 117, 0.6); color: var(--danger); }

        .history-section {
            background: rgba(0,0,0,0.5);
            border-radius: 20px;
            padding: 15px;
            text-align: left;
            font-size: 0.85rem;
            border: 1px solid var(--glass-border);
        }

        .history-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 5px;
        }

        .clear-btn {
            font-size: 0.65rem;
            color: var(--danger);
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            background: none;
            border: none;
        }
        
        #historyList { 
            list-style: none; padding: 0; margin: 0; 
            max-height: 100px; overflow-y: auto;
        }

        li { 
            display: flex; 
            justify-content: space-between; 
            padding: 6px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            color: #ffffff; 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card"><span class="stat-value" id="streakVal">0</span><span class="stat-label">Streak</span></div>
            <div class="stat-card"><span class="stat-value" id="totalSessVal">0</span><span class="stat-label">Sessions</span></div>
            <div class="stat-card"><span class="stat-value" id="totalTimeVal">00:00</span><span class="stat-label">Total Time</span></div>
        </div>

        <div class="circle-container">
            <div class="breathing-circle" id="circle"></div>
            <div class="breathing-text" id="breathingText">Ready</div>
        </div>

        <div class="timer-display" id="display">05:00</div>
        
        <div class="controls">
            <div class="input-row">
                <input type="number" id="minutes" value="5" min="0"> <span>min</span>
                <input type="number" id="secondsInput" value="0" min="0"> <span>sec</span>
            </div>
            
            <div class="btn-group">
                <button id="startBtn">Begin</button>
                <button id="resetBtn">Reset</button>
            </div>
        </div>

        <div class="history-section">
            <div class="history-header">
                <span style="font-size: 0.7rem; color: #666; font-weight: 600; text-transform: uppercase;">Logs (M:S)</span>
                <button class="clear-btn" id="clearHistoryBtn">Clear</button>
            </div>
            <ul id="historyList"></ul>
        </div>
    </div>

    <audio id="gong" preload="auto">
        <source src="gong.mp3" type="audio/mpeg">
    </audio>

    <script>
        let countdown;
        let breathingInterval;
        let isMeditating = false;
        let wakeLock = null; // Stores screen lock state

        const display = document.getElementById('display');
        const minInput = document.getElementById('minutes');
        const secInput = document.getElementById('secondsInput');
        const circle = document.getElementById('circle');
        const breathingText = document.getElementById('breathingText');
        const gong = document.getElementById('gong');

        function formatTime(totalSeconds) {
            const m = Math.floor(totalSeconds / 60);
            const s = Math.floor(totalSeconds % 60);
            return `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
        }

        function updateDisplay() {
            if (isMeditating) return;
            const totalSeconds = (parseInt(minInput.value) || 0) * 60 + (parseInt(secInput.value) || 0);
            display.textContent = formatTime(totalSeconds);
        }

        [minInput, secInput].forEach(i => i.addEventListener('input', updateDisplay));

        // --- NEW IMPROVED WAKE LOCK LOGIC ---
        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log('Wake Lock active. Screen will stay awake!');
                } catch (err) {
                    console.warn(`Wake Lock request failed: ${err.message}`);
                }
            } else {
                console.log('Wake Lock API not supported in this browser environment.');
            }
        }

        function releaseWakeLock() {
            if (wakeLock !== null) {
                wakeLock.release().then(() => {
                    wakeLock = null;
                    console.log('Wake Lock released.');
                });
            }
        }

        function startMeditation(total) {
            isMeditating = true;
            requestWakeLock(); // Lock screen awake on start
            
            gong.currentTime = 0;
            gong.play();

            let inhale = true;
            breathingText.textContent = "Inhale";
            circle.classList.add('expand');
            breathingInterval = setInterval(() => {
                inhale = !inhale;
                breathingText.textContent = inhale ? "Inhale" : "Exhale";
                inhale ? circle.classList.add('expand') : circle.classList.remove('expand');
            }, 4000);

            const then = Date.now() + total * 1000;
            countdown = setInterval(() => {
                const left = Math.round((then - Date.now()) / 1000);
                if (left < 0) { stopMeditation(true, total); return; }
                display.textContent = formatTime(left);
            }, 1000);
        }

        function stopMeditation(completed, total) {
            clearInterval(countdown);
            clearInterval(breathingInterval);
            isMeditating = false;
            releaseWakeLock(); // Let screen sleep again
            
            circle.classList.remove('expand');
            breathingText.textContent = completed ? "Peace" : "Ready";
            updateDisplay();

            if (completed) {
                gong.currentTime = 0;
                gong.play();
                saveToHistory(total);
            }
        }

        function saveToHistory(totalSecs) {
            const history = JSON.parse(localStorage.getItem('medHistory')) || [];
            history.push({ date: new Date().toLocaleDateString(), duration: totalSecs });
            localStorage.setItem('medHistory', JSON.stringify(history));
            updateStats();
        }

        function updateStats() {
            const history = JSON.parse(localStorage.getItem('medHistory')) || [];
            const list = document.getElementById('historyList');
            list.innerHTML = '';
            let totalSecondsAccumulated = 0;
            
            history.slice().reverse().forEach(entry => {
                totalSecondsAccumulated += entry.duration;
                const li = document.createElement('li');
                li.innerHTML = `<span>${entry.date}</span> <span>${formatTime(entry.duration)}</span>`;
                list.appendChild(li);
            });

            document.getElementById('totalSessVal').textContent = history.length;
            document.getElementById('totalTimeVal').textContent = formatTime(totalSecondsAccumulated);
        }

        document.getElementById('clearHistoryBtn').addEventListener('click', () => {
            if(confirm("Clear history?")) { localStorage.removeItem('medHistory'); updateStats(); }
        });

        document.getElementById('startBtn').addEventListener('click', () => {
            if (isMeditating) return;
            const total = (parseInt(minInput.value)||0)*60 + (parseInt(secInput.value)||0);
            if (total > 0) startMeditation(total);
        });

        document.getElementById('resetBtn').addEventListener('click', () => stopMeditation(false));
        updateStats();

        // Re-request wake lock if tab is hidden and comes back to focus
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible' && isMeditating) {
                await requestWakeLock();
            }
        });
    </script>
</body>
</html>
